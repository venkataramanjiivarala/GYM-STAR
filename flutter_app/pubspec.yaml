name: gymstar_mobile
description: "GYM STAR — AI Personal Fitness & Yoga Coach Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.16.1
  http: ^1.2.0
  web_socket_channel: ^2.4.1
  flutter_tts: ^4.2.5
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
